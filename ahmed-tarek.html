  html, body { margin: 0; background: #FAF7F2; }
  #boot { min-height: 100dvh; display: grid; place-items: center; color: #1E1915; text-align: center; }
  #boot .mark { font: 600 26px/1 "Playfair Display", Georgia, serif; letter-spacing: .3em; padding-left: .3em; }
  #boot .sub { margin-top: 12px; font: 500 10px/1 Inter, system-ui, sans-serif; letter-spacing: .32em; color: #8C6239; text-transform: uppercase; animation: bootPulse 1.6s ease-in-out infinite; }
  @keyframes bootPulse { 50% { opacity: .35; } }
  #boot .stuck { margin: 24px auto 0; max-width: 280px; font: 400 13px/1.55 Inter, system-ui, sans-serif; color: #2C221E; }
  #boot .stuck p { margin: 4px 0; }
</style>

<div id="root">
  <div id="boot"><div><div class="mark">NOD</div><div class="sub">Brewing your invitation…</div>
  <noscript><div class="stuck"><p>This invitation opens in a web browser.</p><p>Open the link in <b>Safari</b> or <b>Chrome</b>.</p></div></noscript></div></div>
</div>
<script>
  // If the invitation can't start (very old browser, or a file preview that doesn't run pages), say so.
  setTimeout(function () {
    var boot = document.getElementById("boot");
    if (!boot) return;
    var box = document.createElement("div");
    box.className = "stuck";
    box.innerHTML = "<p>This is taking longer than it should.</p><p>Open the link in Safari or Chrome, or <a href='' style='color:#8C6239'>tap here to reload</a>.</p>";
    boot.firstChild.appendChild(box);
  }, 12000);
</script>

.nod-ease { transition-timing-function: ${EASE}; }
.nod-screen { animation: nodScreenIn .9s ${EASE} backwards; }
.nod-rise { animation: nodRise .8s ${EASE} both; }
.nod-fade { animation: nodFade .5s ease both; }
.nod-sheet { animation: nodSheetUp .6s ${EASE} both; }
.nod-unfold { transform-origin: 50% 0%; animation: nodUnfold 1.4s ${EASE} both; }
.nod-crease { animation: nodCrease 1.8s ease .5s both; }
.nod-foil { background: linear-gradient(100deg, #8C6239 0%, #C49A6C 28%, #F4DFBC 46%, #C49A6C 62%, #8C6239 100%); background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: nodFoil 6s linear infinite; }
.nod-steam { transform-box: fill-box; transform-origin: 50% 100%; animation: nodSteam 3.4s ease-out infinite; }
.nod-ice { transform-box: fill-box; transform-origin: center; animation: nodBob 4.5s ease-in-out infinite; }
.nod-pin-pulse { transform-box: fill-box; transform-origin: center; animation: nodPin 2.4s ease-out infinite; }
.nod-blink { animation: nodBlink 1.8s ease-in-out infinite; }
.nod-brewing { animation: nodFill 1.1s ${EASE} both; }
.nod-scroll { scrollbar-width: none; } .nod-scroll::-webkit-scrollbar { display: none; }
@keyframes nodScreenIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes nodRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes nodFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes nodSheetUp { from { transform: translateY(105%); } to { transform: none; } }
@keyframes nodUnfold { 0% { opacity: 0; transform: perspective(1400px) rotateX(-78deg) translateY(-12px); } 35% { opacity: 1; } 100% { opacity: 1; transform: perspective(1400px) rotateX(0deg); } }
@keyframes nodCrease { from { opacity: 1; } to { opacity: .35; } }
@keyframes nodFoil { from { background-position: 200% 50%; } to { background-position: -100% 50%; } }
@keyframes nodSteam { 0% { opacity: 0; transform: translateY(6px) scaleX(1); } 25% { opacity: .6; } 100% { opacity: 0; transform: translateY(-22px) scaleX(1.5); } }
@keyframes nodBob { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-2.5px) rotate(calc(var(--r, 0deg) + 4deg)); } }
@keyframes nodPin { 0% { opacity: .7; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.6); } }
@keyframes nodBlink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes nodWave { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
@keyframes nodFill { from { transform: translateX(-100%); } to { transform: translateX(0); } }
@media (prefers-reduced-motion: reduce) {
  .nod-root *, .nod-root *::before, .nod-root *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
